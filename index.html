<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Roblox Arab Store — متجر</title>
  <style>
    /* مبسّط: ستايل Luxurious (dark + gold) */
    :root{--bg:#070707;--card:#0f1724;--muted:#9aa4b2;--gold:#c59a3a}
    body{margin:0;font-family: 'Tajawal', system-ui, Arial;background:linear-gradient(180deg,#060606, #0a0a0a);color:#fff;padding:20px}
    .container{max-width:1100px;margin:0 auto}
    header{display:flex;justify-content:space-between;align-items:center}
    h1{margin:0;font-weight:700}
    .store{display:grid;grid-template-columns:1fr 360px;gap:20px;margin-top:18px}
    .catalog{background:var(--card);padding:18px;border-radius:12px}
    .aside{background:linear-gradient(180deg,#0b0b0b, #121212);padding:16px;border-radius:12px}
    .product{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);margin-bottom:10px}
    .product img{width:88px;height:88px;object-fit:cover;border-radius:8px}
    .btn{background:var(--gold);color:#071018;padding:8px 12px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
    .link{color:var(--gold);text-decoration:none}
    .admin-panel{display:none;margin-top:12px;background:#081018;padding:12px;border-radius:8px}
    footer{margin-top:18px;color:var(--muted)}
    @media(max-width:980px){.store{grid-template-columns:1fr}}
  </style>
  <!-- Supabase client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Roblox Arab Store</h1>
      <div>
        <button id="adminBtn" class="btn" style="background:#2b2b2b;color:#fff">دخول الأدمن</button>
      </div>
    </header>

    <div class="store">
      <main class="catalog" id="catalog">
        <div class="muted">المنتجات</div>
        <!-- منتجات افتراضية -->
        <div class="product">
          <img src="https://picsum.photos/200/200?random=1" alt="prod1">
          <div style="flex:1">
            <div style="font-weight:700">قالب رقم 1</div>
            <div class="muted">وصف قصير</div>
          </div>
          <div>
            <button class="btn addCart" data-id="p1" data-name="قالب رقم 1" data-price="5">أضف للسلة</button>
          </div>
        </div>

        <div class="product">
          <img src="https://picsum.photos/200/200?random=2" alt="prod2">
          <div style="flex:1">
            <div style="font-weight:700">قالب رقم 2</div>
            <div class="muted">وصف أفضل</div>
          </div>
          <div>
            <button class="btn addCart" data-id="p2" data-name="قالب رقم 2" data-price="8">أضف للسلة</button>
          </div>
        </div>

      </main>

      <aside class="aside">
        <h3>سلة الشراء</h3>
        <div id="cartList">السلة فارغة</div>
        <div style="margin-top:12px">
          <button id="checkoutBtn" class="btn">الدفع عبر PayPal</button>
        </div>

        <div style="margin-top:12px">
          <a id="paypalRaw" class="link" href="#" target="_blank" rel="noopener" style="display:block">رابط بايبال (مباشر)</a>
        </div>

        <div id="adminPanel" class="admin-panel">
          <div style="font-weight:700">لوحة الأدمن</div>
          <div style="margin-top:8px">
            <button id="goToOrders" class="btn" style="background:#2b2b2b">عرض الطلبات</button>
          </div>
        </div>
      </aside>
    </div>

    <footer>تم تصميمه بواسطة بوت تحسين - PayPal integration (server-side recommended)</footer>
  </div>

  <script>
    // Configuration (placeholders) - ضع القيم في بيئة الاستضافة أو استبدل هنا مؤقتا
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const PAYPAL_PUBLIC_CLIENT = 'YOUR_PAYPAL_CLIENT_ID'; // يستخدم في client for sdk only
    const PAYPAL_ME_LINK = 'https://paypal.me/yazedBader'; // fallback link

    const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Cart logic simple
    let cart = [];
    const cartList = document.getElementById('cartList');
    function renderCart(){
      if (cart.length===0){ cartList.textContent='السلة فارغة'; return }
      cartList.innerHTML = '';
      let total=0;
      cart.forEach(item=>{
        total += Number(item.price);
        const el = document.createElement('div');
        el.textContent = `${item.name} — ${item.price} SAR`;
        cartList.appendChild(el);
      });
      const t = document.createElement('div'); t.style.marginTop='8px'; t.style.fontWeight='700'; t.textContent = 'الإجمالي: ' + total + ' SAR';
      cartList.appendChild(t);
      document.getElementById('paypalRaw').href = PAYPAL_ME_LINK + '?amount=' + total;
    }

    document.querySelectorAll('.addCart').forEach(btn=> btn.addEventListener('click', ()=>{
      cart.push({ id:btn.dataset.id, name:btn.dataset.name, price:btn.dataset.price }); renderCart();
    }));

    // Admin button now redirects to admin-login page
    const adminBtn = document.getElementById('adminBtn');
    adminBtn.addEventListener('click', ()=> window.location.href = '/admin-login.html');

    // Show admin panel when current user is admin (if session exists at load)
    async function checkAdminOnLoad(){
      try{
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) return; // no signed-in user
        const user = session.user;
        // fetch profile
        const { data: profile, error } = await supabase.from('profiles').select('is_admin').eq('id', user.id).single();
        if (profile && profile.is_admin) document.getElementById('adminPanel').style.display='block';
      }catch(e){ console.error(e); }
    }

    // Checkout: client calls server to create order (recommended)
    document.getElementById('checkoutBtn').addEventListener('click', async ()=>{
      if (cart.length===0){ alert('السلة فارغة'); return; }
      // Try server integration
      try{
        const res = await fetch('/api/create-order', {
          method:'POST', headers:{'content-type':'application/json'},
          body: JSON.stringify({ items: cart, total: cart.reduce((s,i)=>s+Number(i.price),0) })
        });
        if (res.ok){
          const j = await res.json();
          // open approval url in new tab (safe)
          if (j.approvalUrl) window.open(j.approvalUrl, '_blank','noopener');
          else window.open(PAYPAL_ME_LINK,'_blank','noopener');
        } else {
          // fallback to paypal.me
          window.open(PAYPAL_ME_LINK,'_blank','noopener');
        }
      }catch(e){ console.error(e); window.open(PAYPAL_ME_LINK,'_blank','noopener'); }
    });

    // On load
    renderCart();
    checkAdminOnLoad();
  </script>
</body>
</html>
