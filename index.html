<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني الذكي</title>
    <!-- استدعاء مكتبة Supabase السحابية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding-bottom: 50px;
        }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-outline:hover {
            background: #f1f5f9;
        }

        .btn-danger {
            background: var(--danger);
        }
        .btn-danger:hover {
            background: #dc2626;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }

        .product-img {
            width: 100%;
            height: 160px;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .product-price {
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .product-info .btn {
            margin-top: auto;
            width: 100%;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            padding: 20px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        #admin-panel {
            display: none;
            background: #fff;
            border: 2px dashed var(--primary);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .admin-table th, .admin-table td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: right;
            font-size: 0.9rem;
        }

        .admin-table th {
            background: #f1f5f9;
        }

        .badge {
            background: #e0e7ff;
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🛍️ متجري الإلكتروني</div>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="openCart()">السلة (<span id="cart-count">0</span>)</button>
            <button class="btn btn-outline" onclick="checkAdmin()">دخول الأدمن 🔒</button>
        </div>
    </header>

    <div class="container">
        
        <div id="admin-panel">
            <h2>🛠️ لوحة تحكم الأدمن (متصل بـ Supabase)</h2>
            <p style="color: var(--text-light); margin-bottom: 15px; font-size: 0.9rem;">أنت مسجل دخول كمسؤول. الطلبات والمنتجات هنا مرتبطة بالسحاب مباشرة.</p>
            
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="btn" onclick="showAddProductForm()">+ إضافة منتج جديد</button>
                <button class="btn btn-danger" onclick="logoutAdmin()">تسجيل خروج الأدمن</button>
            </div>

            <h3>📦 طلبات العملاء السحابية:</h3>
            <div style="overflow-x: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>اسم العميل</th>
                            <th>الجوال</th>
                            <th>المنتجات</th>
                            <th>العنوان</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="orders-list">
                    </tbody>
                </table>
            </div>
        </div>

        <h2 class="section-title">منتجات المتجر</h2>
        <div class="products-grid" id="products-container">
        </div>
    </div>

    <!-- نافذة السلة -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>سلة المشتريات</h3>
                <button class="close-btn" onclick="closeCart()">×</button>
            </div>
            <div id="cart-items-container">
            </div>
            <div style="margin: 15px 0; font-weight: bold; font-size: 1.1rem;">
                المجموع الكلي: <span id="cart-total">0</span> ر.س
            </div>
            
            <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
            
            <h3>بيانات الشحن لإتمام الطلب:</h3>
            <div class="form-group" style="margin-top: 10px;">
                <label>اسم العميل:</label>
                <input type="text" id="customer-name" placeholder="أدخل اسمك الكريم">
            </div>
            <div class="form-group">
                <label>رقم الجوال:</label>
                <input type="tel" id="customer-phone" placeholder="05xxxxxxxx">
            </div>
            <div class="form-group">
                <label>العنوان:</label>
                <textarea id="customer-address" placeholder="المدينة، الحي"></textarea>
            </div>
            <button class="btn" style="width: 100%; padding: 12px;" onclick="checkout()">إرسال الطلب للسيرفر</button>
        </div>
    </div>

    <!-- نافذة إضافة منتج -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>إضافة منتج جديد</h3>
                <button class="close-btn" onclick="closeProductModal()">×</button>
            </div>
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="new-p-name" placeholder="مثال: بطاقة شحن / لعبة">
            </div>
            <div class="form-group">
                <label>السعر (ر.س):</label>
                <input type="number" id="new-p-price" placeholder="100">
            </div>
            <button class="btn" style="width: 100%; padding: 12px;" onclick="saveNewProduct()">حفظ في Supabase</button>
        </div>
    </div>

    <script>
        // إعدادات اتصال Supabase (قم باستبدال القيم بالرابط والمفتاح الخاص بك)
        const SUPABASE_URL = 'https://YOUR_SUPABASE_URL.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let products = [];
        let cart = [];
        let orders = [];
        let isAdmin = localStorage.getItem('store_is_admin') === 'true';

        window.onload = async function() {
            await fetchProducts();
            updateCartCount();
            if (isAdmin) {
                document.getElementById('admin-panel').style.display = 'block';
                await fetchOrders();
            }
        };

        // جلب المنتجات من قاعدة بيانات Supabase
        async function fetchProducts() {
            const { data, error } = await supabaseClient.from('products').select('*');
            if (error) {
                console.log('خطأ في جلب المنتجات، جلب منتجات افتراضية مؤقتة');
                products = [
                    { id: 1, name: 'سماعة ألعاب (Gaming Headset)', price: 199 },
                    { id: 2, name: 'ماوس احترافي (RGB Mouse)', price: 120 }
                ];
            } else {
                products = data;
            }
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            if(products.length === 0) {
                container.innerHTML = '<p>لا توجد منتجات حالياً.</p>';
                return;
            }
            products.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <div class="product-img">منتج رقمي / مادي</div>
                        <div class="product-info">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">${p.price} ر.س</div>
                            <button class="btn" onclick="addToCart(${p.id})">إضافة للسلة</button>
                            ${isAdmin ? `<button class="btn btn-danger" style="margin-top:5px;" onclick="deleteProduct('${p.id}')">حذف</button>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id == id);
            cart.push(product);
            updateCartCount();
            alert('تمت الإضافة إلى السلة!');
        }

        function updateCartCount() {
            document.getElementById('cart-count').innerText = cart.length;
        }

        function openCart() {
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = '<p style="color:var(--text-light); text-align:center; padding:20px;">السلة فارغة</p>';
            } else {
                cart.forEach((item, index) => {
                    total += item.price;
                    container.innerHTML += `
                        <div class="cart-item">
                            <span>${item.name}</span>
                            <span>${item.price} ر.س</span>
                            <button class="btn btn-danger" style="padding:2px 8px; font-size:0.8rem;" onclick="removeFromCart(${index})">حذف</button>
                        </div>
                    `;
                });
            }
            document.getElementById('cart-total').innerText = total;
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function closeCart() {
            document.getElementById('cart-modal').style.display = 'none';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            openCart();
            updateCartCount();
        }

        // إرسال الطلب وحفظه في جدول orders بـ Supabase
        async function checkout() {
            const name = document.getElementById('customer-name').value;
            const phone = document.getElementById('customer-phone').value;
            const address = document.getElementById('customer-address').value;

            if (!name || !phone || !address) {
                alert('الرجاء تعبئة بيانات الشحن كاملة');
                return;
            }

            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            const orderData = {
                customer_name: name,
                phone: phone,
                address: address,
                items: cart.map(i => i.name).join('، '),
                total: cart.reduce((sum, i) => sum + i.price, 0)
            };

            const { error } = await supabaseClient.from('orders').insert([orderData]);

            if (error) {
                alert('حدث خطأ أثناء إرسال الطلب، تأكد من إعدادات قاعدة البيانات.');
                console.error(error);
            } else {
                alert('تم إرسال طلبك بنجاح وحفظه في السيرفر!');
                cart = [];
                updateCartCount();
                closeCart();
                document.getElementById('customer-name').value = '';
                document.getElementById('customer-phone').value = '';
                document.getElementById('customer-address').value = '';
            }
        }

        function checkAdmin() {
            if (isAdmin) {
                alert('أنت مسجل دخول بالفعل!');
                return;
            }
            const pass = prompt('أدخل الرمز السري للأدمن:');
            if (pass === '1213121312131910') {
                isAdmin = true;
                localStorage.setItem('store_is_admin', 'true');
                document.getElementById('admin-panel').style.display = 'block';
                fetchOrders();
                renderProducts();
                alert('تم تسجيل الدخول كمسؤول بنجاح.');
            } else if (pass !== null) {
                alert('الرمز السري غير صحيح!');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            localStorage.setItem('store_is_admin', 'false');
            document.getElementById('admin-panel').style.display = 'none';
            renderProducts();
            alert('تم تسجيل الخروج.');
        }

        async function fetchOrders() {
            const { data, error } = await supabaseClient.from('orders').select('*');
            if (!error) {
                orders = data;
                renderOrders();
            }
        }

        function renderOrders() {
            const tbody = document.getElementById('orders-list');
            tbody.innerHTML = '';
            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-light);">لا توجد طلبات واردة حالياً</td></tr>`;
                return;
            }
            orders.forEach((o) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${o.customer_name}</td>
                        <td>${o.phone}</td>
                        <td><span class="badge">${o.items}</span> (${o.total} ر.س)</td>
                        <td>${o.address}</td>
                        <td><button class="btn btn-danger" style="padding:4px 8px; font-size:0.8rem;" onclick="deleteOrder('${o.id}')">حذف</button></td>
                    </tr>
                `;
            });
        }

        async function deleteOrder(id) {
            if (confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
                await supabaseClient.from('orders').delete().eq('id', id);
                fetchOrders();
            }
        }

        function showAddProductForm() {
            document.getElementById('product-modal').style.display = 'flex';
        }

        function closeProductModal() {
            document.getElementById('product-modal').style.display = 'none';
        }

        async function saveNewProduct() {
            const name = document.getElementById('new-p-name').value;
            const price = parseFloat(document.getElementById('new-p-price').value);

            if (!name || isNaN(price)) {
                alert('الرجاء كتابة اسم المنتج والسعر بشكل صحيح');
                return;
            }

            const { error } = await supabaseClient.from('products').insert([{ name, price }]);

            if (error) {
                alert('فشل حفظ المنتج في قاعدة البيانات.');
                console.error(error);
            } else {
                alert('تمت إضافة المنتج بنجاح!');
                closeProductModal();
                document.getElementById('new-p-name').value = '';
                document.getElementById('new-p-price').value = '';
                fetchProducts();
            }
        }

        async function deleteProduct(id) {
            if (confirm('هل أنت متأكد من حذف المنتج؟')) {
                await supabaseClient.from('products').delete().eq('id', id);
                fetchProducts();
            }
        }
    </script>
</body>
</html>
